name: Build & Deploy to Play Store

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      # ── Checkout ──
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Version Bump (push only) ──
      - name: Detect bump flag
        if: github.event_name == 'push'
        id: bump
        run: |
          BUMP_FLAG=""
          # Check PR labels from merge commit
          PR_NUMBER=$(echo "${{ github.event.head_commit.message }}" | grep -oP '#\K[0-9]+' | head -1 || true)
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
            if echo "$LABELS" | grep -q "bump:major"; then
              BUMP_FLAG="--major"
            elif echo "$LABELS" | grep -q "bump:minor"; then
              BUMP_FLAG="--minor"
            fi
          fi
          # Fallback to commit message flags
          if [ -z "$BUMP_FLAG" ]; then
            if echo "${{ github.event.head_commit.message }}" | grep -qi '\[major\]'; then
              BUMP_FLAG="--major"
            elif echo "${{ github.event.head_commit.message }}" | grep -qi '\[minor\]'; then
              BUMP_FLAG="--minor"
            fi
          fi
          echo "flag=$BUMP_FLAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        if: github.event_name == 'push'
        id: version
        run: |
          chmod +x scripts/bump-version.sh
          NEW_VERSION=$(./scripts/bump-version.sh ${{ steps.bump.outputs.flag }})
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.json app/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      # ── Node Setup + Cache ──
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # ── Google Services ──
      - name: Decode google-services.json
        run: printenv GOOGLE_SERVICES_JSON > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── Expo Prebuild ──
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        working-directory: app

      # ── Ruby + Fastlane Setup ──
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      # ── Gradle Cache ──
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Keystore ──
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Service Account ──
      - name: Write Play service account JSON
        run: printenv PLAY_SERVICE_ACCOUNT_JSON > /tmp/play-service-account.json
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      # ── Validate secrets ──
      - name: Validate required secrets
        run: |
          FAIL=0
          # JSON files
          python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null || { echo "::error::GOOGLE_SERVICES_JSON is missing or malformed"; FAIL=1; }
          python3 -c "import json; json.load(open('/tmp/play-service-account.json'))" 2>/dev/null || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing or malformed"; FAIL=1; }
          # Keystore
          [ -s /tmp/release.keystore ] || { echo "::error::KEYSTORE_BASE64 is missing or empty"; FAIL=1; }
          # String secrets
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD is not set"; FAIL=1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::KEY_ALIAS is not set"; FAIL=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD is not set"; FAIL=1; }
          [ $FAIL -eq 0 ] && echo "All secrets valid" || exit 1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Build + Deploy ──
      - name: Fastlane deploy
        run: bundle exec fastlane android deploy
        working-directory: app
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: /tmp/play-service-account.json

      # ── Force Update (push only) ──
      - name: Update Firestore minVersion
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[force-update]')
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          if [ -z "$NEW_VERSION" ]; then
            echo "ERROR: new_version is empty, skipping minVersion update"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npm install -g firebase-admin@13
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp();
            admin.firestore()
              .doc('config/app')
              .update({ minVersion: process.env.NEW_VERSION })
              .then(() => { console.log('minVersion updated to ' + process.env.NEW_VERSION); process.exit(0); })
              .catch(e => { console.error(e); process.exit(1); });
          "
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}

      # ── PR Comment ──
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('./app/app.json').expo.version;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Build deployed to internal testing. Version: **${version}**`
            });
