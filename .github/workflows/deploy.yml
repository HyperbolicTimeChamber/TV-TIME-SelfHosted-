# Play Store / App Store releases are off for now — production APKs are published as GitHub
# Releases and the apps update themselves from there (in-app updater)
name: Build & Distribute (Production)

on:
  push:
    branches: [main]
    # Only build the mobile app when the mobile app (or this workflow) changed
    paths:
      - "app/**"
      - "functions/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "functions/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  # Queue instead of cancel: a cancelled run skips its force update + version bump
  cancel-in-progress: false

jobs:
  build-deploy:
    environment: prod
    # Version bump commits back to main / development
    permissions:
      contents: write
      pull-requests: write
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      # ── Checkout ──
      # RELEASE_PUSH_TOKEN: a token of an account allowed past the branch protection on main and
      # development — the workflow's own token can't push the version bump there
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Version Bump (push only) ──
      - name: Detect bump flag
        if: github.event_name == 'push'
        id: bump
        run: |
          BUMP_FLAG=""
          # Write commit message to file to avoid shell expansion of special chars
          git log -1 --format=%B > /tmp/commit_msg.txt
          # Check PR labels from merge commit
          PR_NUMBER=$(grep -oP '#\K[0-9]+' /tmp/commit_msg.txt | head -1 || true)
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)
            if echo "$LABELS" | grep -q "bump:major"; then
              BUMP_FLAG="major"
            elif echo "$LABELS" | grep -q "bump:minor"; then
              BUMP_FLAG="minor"
            fi
          fi
          # Fallback to commit message flags
          if [ -z "$BUMP_FLAG" ]; then
            if grep -qi '\[major\]' /tmp/commit_msg.txt; then
              BUMP_FLAG="major"
            elif grep -qi '\[minor\]' /tmp/commit_msg.txt; then
              BUMP_FLAG="minor"
            fi
          fi
          echo "flag=$BUMP_FLAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Version policy (scripts/release-version.cjs): the merge brings staging's number (staging is
      # always main + 1 patch) -> main inherits it; [minor]/[major] bump the previous main version;
      # a hotfix straight on main (version unchanged) gets a patch bump. versionCode/buildNumber =
      # previous main build + 1 (bump-build.yml does not run after production).
      - name: Bump version (local only)
        if: github.event_name == 'push'
        id: version
        run: |
          NEW_VERSION=$(node scripts/release-version.cjs main --before "$BEFORE_SHA" --flag "$BUMP_FLAG")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $NEW_VERSION (will commit after successful build)"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUMP_FLAG: ${{ steps.bump.outputs.flag }}

      # ── Node Setup + Cache ──
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # ── Tests (fail fast before the slow build) ──
      - name: Run app tests
        run: npm test
        working-directory: app

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run functions tests
        run: npm test
        working-directory: functions

      # ── Google Services ──
      - name: Decode google-services.json
        run: printenv GOOGLE_SERVICES_JSON > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── App env (app/.env is gitignored; values live in repo Secrets) ──
      - name: Write app .env
        run: |
          {
            echo "EXPO_PUBLIC_WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}"
            echo "EXPO_PUBLIC_TMDB_API_BASE=${{ secrets.TMDB_API_BASE }}"
            echo "EXPO_PUBLIC_MIXPANEL_TOKEN=${{ secrets.MIXPANEL_TOKEN }}"
            echo "EXPO_PUBLIC_MIXPANEL_SERVER_URL=${{ secrets.MIXPANEL_SERVER_URL }}"
            echo "EXPO_PUBLIC_RELEASE_CHANNEL=prod"
            echo "EXPO_PUBLIC_UPDATE_URL=${{ secrets.APP_UPDATE_URL }}"
          } > app/.env

      # ── Expo Prebuild ──
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        working-directory: app

      # ── Ruby + Fastlane Setup ──
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      # ── Gradle Cache ──
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Keystore ──
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Firebase Service Account ──
      - name: Write Firebase service account JSON
        run: printenv FIREBASE_SERVICE_ACCOUNT_JSON > /tmp/firebase-sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # ── Validate secrets ──
      - name: Validate required secrets
        run: |
          FAIL=0
          # JSON files
          python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null || { echo "::error::GOOGLE_SERVICES_JSON is missing or malformed"; FAIL=1; }
          python3 -c "import json; json.load(open('/tmp/firebase-sa.json'))" 2>/dev/null || { echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is missing or malformed"; FAIL=1; }
          # Keystore
          [ -s /tmp/release.keystore ] || { echo "::error::KEYSTORE_BASE64 is missing or empty"; FAIL=1; }
          # String secrets
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD is not set"; FAIL=1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::KEY_ALIAS is not set"; FAIL=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD is not set"; FAIL=1; }
          [ -n "$FIREBASE_APP_ID" ] || { echo "::error::FIREBASE_APP_ID is not set"; FAIL=1; }
          [ $FAIL -eq 0 ] && echo "All secrets valid" || exit 1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      # ── Extract release notes from commit ──
      - name: Set release notes
        id: notes
        run: |
          {
            echo "release_notes<<NOTES_EOF"
            git log -1 --pretty=format:"%s"
            echo ""
            git log -1 --pretty=format:"%b" | grep -v "^Co-Authored-By" | head -10
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build (Play Store upload disabled: `fastlane android deploy`) ──
      # Production APKs go to GitHub Releases (no more Firebase App Distribution); PRs to main
      # build too and attach the APK to the run, so it can be tried before merge
      - name: Fastlane build APK
        run: bundle exec fastlane android build_apk
        working-directory: app
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload PR APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: watchloom-pr-${{ github.event.number }}
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      # ── GitHub Release with the APK (the in-app updater downloads it from here) ──
      - name: Prepare APK
        if: github.event_name == 'push'
        id: apk
        run: |
          VERSION=$(node -p "require('./app/app.json').expo.version")
          BUILD=$(node -p "require('./app/app.json').expo.android.versionCode")
          SRC=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          NAME="watchloom.apk"
          cp "$SRC" "/tmp/$NAME"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "path=/tmp/$NAME"
            echo "name=$NAME"
            echo "size=$(stat -c %s "/tmp/$NAME")"
            echo "tag=v${VERSION}+${BUILD}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: V${{ steps.apk.outputs.version }} (build ${{ steps.apk.outputs.build }})
          body: ${{ steps.notes.outputs.release_notes }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only the newest build of each version stays on GitHub (per channel): older builds of the
      # same x.y.z are deleted with their tags
      - name: Prune older builds of this version
        if: github.event_name == 'push'
        run: |
          VERSION_RE=$(echo "${{ steps.apk.outputs.version }}" | sed 's/\./\\./g')
          gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep -E "^v${VERSION_RE}\+[0-9]+$" \
            | grep -vx "${{ steps.apk.outputs.tag }}" \
            | while read -r TAG; do
                echo "Deleting $TAG"
                gh release delete "$TAG" --cleanup-tag -y
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # config/release.prod (drawer + force gate), [force-update] → minBuild, FCM push
      - name: Publish release to the apps
        if: github.event_name == 'push'
        run: node scripts/publish-release.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          CHANNEL: prod
          VERSION: ${{ steps.apk.outputs.version }}
          BUILD: ${{ steps.apk.outputs.build }}
          SIZE: ${{ steps.apk.outputs.size }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.apk.outputs.tag }}/${{ steps.apk.outputs.name }}
          NOTES: ${{ steps.notes.outputs.release_notes }}
          FORCE: ${{ contains(github.event.head_commit.message, '[force-update]') }}

      # ── Version bump commit + staging one version ahead (only after the release went out) ──
      # Committed locally first so the merge into staging carries it: the next staging -> main
      # merge then has main's version / build lines in its merge base (no conflicts there)
      - name: Commit version bump locally
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.json app/package.json app/package-lock.json
          git diff --cached --quiet && { echo "No version change to commit"; exit 0; }
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"

      # Runs before the push to main (which can fail on branch protection). Separate worktree: this
      # job's working tree is dirty (generated files). Staging gets main's commits (hotfixes too)
      # with its own version lines kept (-X ours), then main + 1 patch (never lower than staging's)
      - name: Move staging one version ahead
        id: staging
        if: github.event_name == 'push' && success()
        run: |
          # No git-crypt key in CI: pass the filtered files through untouched
          git config filter.git-crypt.smudge cat
          git config filter.git-crypt.clean cat
          git config filter.git-crypt.required false
          git config diff.git-crypt.textconv cat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAIN_SHA=$(git rev-parse HEAD)
          WT="$RUNNER_TEMP/staging-wt"
          git fetch origin staging
          git worktree add -B staging-bump "$WT" origin/staging
          if ! git -C "$WT" merge -X ours --no-edit -m "chore: merge main into staging [skip ci]" "$MAIN_SHA"; then
            git -C "$WT" merge --abort || true
            echo "::error::Merging main into staging conflicted beyond -X ours (delete/modify or binary). Merge main into staging by hand."
            exit 1
          fi
          STAGING_VERSION=$(node scripts/release-version.cjs staging --main "$MAIN_VERSION" --dir "$WT")
          git -C "$WT" add app/app.json app/package.json app/package-lock.json
          git -C "$WT" diff --cached --quiet || git -C "$WT" commit -m "chore: staging moves to $STAGING_VERSION [skip ci]"
          if ! git -C "$WT" push origin HEAD:staging; then
            echo "::error::Push to staging was rejected (staging moved or is protected). Not forcing."
            exit 1
          fi
          echo "Staging is now $STAGING_VERSION"
        env:
          MAIN_VERSION: ${{ steps.version.outputs.new_version }}

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Nothing to push"
            exit 0
          fi
          git push origin HEAD:main

      # development gets the new staging's version files (development -> staging merges stay
      # conflict-free). Independent of the push to main, so it also runs when that failed.
      - name: Sync version bump to development
        if: ${{ !cancelled() && github.event_name == 'push' && steps.staging.outcome == 'success' }}
        run: |
          git fetch origin staging development
          git checkout development
          git checkout origin/staging -- app/app.json app/package.json app/package-lock.json
          git add app/app.json app/package.json app/package-lock.json
          if git diff --cached --quiet; then
            echo "development already up to date"
          else
            git commit -m "chore: sync version files from staging (main released ${{ steps.version.outputs.new_version }}) [skip ci]"
            git push origin development
          fi
          git checkout main

      # ── PR Comment ──
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = require('./app/app.json').expo.version;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `APK attached to the workflow run. Version: **${version}**`
            });
