name: Build & Distribute (Staging)

on:
  push:
    branches: [staging]
    # Only build the mobile app when the mobile app (or this workflow) changed
    paths:
      - "app/**"
      - "functions/**"
      - ".github/workflows/distribute.yml"

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    environment: dev
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      # ── Checkout ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Node Setup + Cache ──
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # ── Tests (fail fast before the slow build) ──
      - name: Run app tests
        run: npm test
        working-directory: app

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run functions tests
        run: npm test
        working-directory: functions

      # ── Google Services ──
      - name: Decode google-services.json
        run: printenv GOOGLE_SERVICES_JSON > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── App env (app/.env is gitignored; values live in repo Secrets) ──
      - name: Write app .env
        run: |
          {
            echo "EXPO_PUBLIC_WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}"
            echo "EXPO_PUBLIC_TMDB_API_BASE=${{ secrets.TMDB_API_BASE }}"
            echo "EXPO_PUBLIC_MIXPANEL_TOKEN=${{ secrets.MIXPANEL_TOKEN }}"
            echo "EXPO_PUBLIC_MIXPANEL_SERVER_URL=${{ secrets.MIXPANEL_SERVER_URL }}"
            echo "EXPO_PUBLIC_RELEASE_CHANNEL=dev"
            echo "EXPO_PUBLIC_UPDATE_URL=${{ secrets.APP_UPDATE_URL }}"
          } > app/.env

      # ── Expo Prebuild ──
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        working-directory: app

      # ── Ruby + Fastlane Setup ──
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      # ── Gradle Cache ──
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Keystore ──
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Firebase Service Account ──
      - name: Write Firebase service account JSON
        run: printenv FIREBASE_SERVICE_ACCOUNT_JSON > /tmp/firebase-sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # ── Validate secrets ──
      - name: Validate required secrets
        run: |
          FAIL=0
          # JSON files
          python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null || { echo "::error::GOOGLE_SERVICES_JSON is missing or malformed"; FAIL=1; }
          python3 -c "import json; json.load(open('/tmp/firebase-sa.json'))" 2>/dev/null || { echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is missing or malformed"; FAIL=1; }
          # Keystore
          [ -s /tmp/release.keystore ] || { echo "::error::KEYSTORE_BASE64 is missing or empty"; FAIL=1; }
          # String secrets
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD is not set"; FAIL=1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::KEY_ALIAS is not set"; FAIL=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD is not set"; FAIL=1; }
          [ -n "$FIREBASE_APP_ID" ] || { echo "::error::FIREBASE_APP_ID is not set"; FAIL=1; }
          [ $FAIL -eq 0 ] && echo "All secrets valid" || exit 1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      # ── Extract release notes from commit ──
      - name: Set release notes
        id: notes
        run: |
          {
            echo "release_notes<<NOTES_EOF"
            git log -1 --pretty=format:"%s"
            echo ""
            git log -1 --pretty=format:"%b" | grep -v "^Co-Authored-By" | head -10
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build + Distribute ──
      - name: Fastlane distribute
        run: bundle exec fastlane android distribute
        working-directory: app
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON_PATH: /tmp/firebase-sa.json
          RELEASE_NOTES: ${{ steps.notes.outputs.release_notes }}
          FIREBASE_TESTER_GROUPS: alpha-channel

      # ── GitHub Release with the APK (the in-app updater downloads it from here) ──
      - name: Prepare APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app/app.json').expo.version")
          BUILD=$(node -p "require('./app/app.json').expo.android.versionCode")
          SRC=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          # One name for every release (staging and main): each sits under its own tag, and main's
          # newest is always at releases/latest/download/watchloom.apk
          NAME="watchloom.apk"
          cp "$SRC" "/tmp/$NAME"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "path=/tmp/$NAME"
            echo "name=$NAME"
            echo "size=$(stat -c %s "/tmp/$NAME")"
            echo "tag=v${VERSION}+${BUILD}-staging"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: V${{ steps.apk.outputs.version }} (build ${{ steps.apk.outputs.build }}) staging
          body: ${{ steps.notes.outputs.release_notes }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only the newest build of each version stays on GitHub (per channel): older builds of the
      # same x.y.z are deleted with their tags
      - name: Prune older builds of this version
        run: |
          VERSION_RE=$(echo "${{ steps.apk.outputs.version }}" | sed 's/\./\\./g')
          gh release list --limit 200 --json tagName -q '.[].tagName' \
            | grep -E "^v${VERSION_RE}\+[0-9]+-staging$" \
            | grep -vx "${{ steps.apk.outputs.tag }}" \
            | while read -r TAG; do
                echo "Deleting $TAG"
                gh release delete "$TAG" --cleanup-tag -y
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # config/release.dev (drawer + force gate), [force-update] → minBuild, FCM push
      - name: Publish release to the apps
        run: node scripts/publish-release.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          CHANNEL: dev
          VERSION: ${{ steps.apk.outputs.version }}
          BUILD: ${{ steps.apk.outputs.build }}
          SIZE: ${{ steps.apk.outputs.size }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.apk.outputs.tag }}/${{ steps.apk.outputs.name }}
          NOTES: ${{ steps.notes.outputs.release_notes }}
          FORCE: ${{ contains(github.event.head_commit.message, '[force-update]') }}
