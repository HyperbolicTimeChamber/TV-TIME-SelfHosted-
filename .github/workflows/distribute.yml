name: Build & Distribute (Development)

on:
  push:
    branches: [development]

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      # ── Checkout ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Version Bump (minor/major only) ──
      - name: Detect bump flag
        id: bump
        run: |
          BUMP_FLAG=""
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qi '\[major\]'; then
            BUMP_FLAG="--major"
          elif echo "$MSG" | grep -qi '\[minor\]'; then
            BUMP_FLAG="--minor"
          fi
          echo "flag=$BUMP_FLAG" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.bump.outputs.flag != ''
        id: version
        run: |
          chmod +x scripts/bump-version.sh
          NEW_VERSION=$(./scripts/bump-version.sh ${{ steps.bump.outputs.flag }})
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Commit version bump
        if: steps.bump.outputs.flag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/app.json app/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      # ── Node Setup + Cache ──
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # ── Google Services ──
      - name: Decode google-services.json
        run: printenv GOOGLE_SERVICES_JSON > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── Expo Prebuild ──
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        working-directory: app

      # ── Ruby + Fastlane Setup ──
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      # ── Gradle Cache ──
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Keystore ──
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── Firebase Service Account ──
      - name: Write Firebase service account JSON
        run: printenv FIREBASE_SERVICE_ACCOUNT_JSON > /tmp/firebase-sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # ── Validate secrets ──
      - name: Validate required secrets
        run: |
          FAIL=0
          # JSON files
          python3 -c "import json; json.load(open('app/google-services.json'))" 2>/dev/null || { echo "::error::GOOGLE_SERVICES_JSON is missing or malformed"; FAIL=1; }
          python3 -c "import json; json.load(open('/tmp/firebase-sa.json'))" 2>/dev/null || { echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is missing or malformed"; FAIL=1; }
          # Keystore
          [ -s /tmp/release.keystore ] || { echo "::error::KEYSTORE_BASE64 is missing or empty"; FAIL=1; }
          # String secrets
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD is not set"; FAIL=1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::KEY_ALIAS is not set"; FAIL=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD is not set"; FAIL=1; }
          [ -n "$FIREBASE_APP_ID" ] || { echo "::error::FIREBASE_APP_ID is not set"; FAIL=1; }
          [ $FAIL -eq 0 ] && echo "All secrets valid" || exit 1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      # ── Extract release notes from commit ──
      - name: Set release notes
        id: notes
        run: |
          {
            echo "release_notes<<NOTES_EOF"
            git log -1 --pretty=format:"%s"
            echo ""
            git log -1 --pretty=format:"%b" | grep -v "^Co-Authored-By" | head -10
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build + Distribute ──
      - name: Fastlane distribute
        run: bundle exec fastlane android distribute
        working-directory: app
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON_PATH: /tmp/firebase-sa.json
          RELEASE_NOTES: ${{ steps.notes.outputs.release_notes }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
